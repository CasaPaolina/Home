name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject passwords from repository secrets
        env:
          GUEST_AREA: ${{ secrets.GUEST_AREA }}
          ADMIN_CHECKIN: ${{ secrets.ADMIN_CHECKIN }}
        run: |
          if [ -z "$GUEST_AREA" ] || [ -z "$ADMIN_CHECKIN" ]; then
            echo "::error::Missing GUEST_AREA and/or ADMIN_CHECKIN repository secret."
            exit 1
          fi
          # Escape characters that are special to sed replacement strings
          esc() { printf '%s' "$1" | sed -e 's/[&/\]/\\&/g'; }
          GUEST_AREA_ESC=$(esc "$GUEST_AREA")
          ADMIN_CHECKIN_ESC=$(esc "$ADMIN_CHECKIN")
          sed -i "s/__GUEST_AREA__/${GUEST_AREA_ESC}/g" guest-info.html js/main.js
          sed -i "s/__ADMIN_CHECKIN__/${ADMIN_CHECKIN_ESC}/g" js/admin-checkin.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
